/* Jeden vizuální svět: papír a pastelky. Celoobrazovkové plátno, menu jako papírové kartičky. */
:root{
  --paper:#fbf7ec; --paper2:#f2ead6; --ink:#2e1f16; --leaf:#4f9a2c; --leaf2:#62b33a;
  --sun:#f6c431; --berry:#d9343f; --bark:#8a5a30;
  --display:"Majopis","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Majopis","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{position:fixed;inset:0;background:var(--paper)}
canvas{display:block;width:100%;height:100%}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px dashed var(--berry);outline-offset:3px}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  font-family:var(--body);font-size:22px;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;background:rgba(251,247,236,.88);border:2.5px solid var(--ink);
  border-radius:14px 10px 16px 9px;padding:2px 12px;font-variant-numeric:tabular-nums}
.chip img{height:26px}
#slowChip{background:#e8f0b4}
#slowChip.voda{background:#cfe8f8}
.spacer{flex:1}
.hbtn{pointer-events:auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px 16px 10px 14px;
  font-size:20px;padding:2px 12px}

/* Překryvné obrazovky */
.screen{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;
  background:rgba(251,247,236,.78);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:26px 18px 30px 16px;
  box-shadow:6px 7px 0 rgba(46,31,22,.18);padding:18px 26px 22px;max-width:760px;width:100%;
  font-family:var(--body);font-size:21px;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(50px,10vw,84px);line-height:1;margin:6px 0 0;
  color:var(--leaf);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px;text-wrap:balance}
.sub{margin:6px 0 14px;font-size:22px}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:8px 0 14px}
.animal{background:transparent;border:2.5px dashed rgba(46,31,22,.35);border-radius:16px;padding:6px 4px 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px;min-width:0}
.animal img{height:64px;max-width:100%;object-fit:contain}
.animal[aria-pressed="true"]{border:3px solid var(--ink);background:#fff6cf}
.animal:disabled{cursor:not-allowed}
.animal:disabled img{filter:grayscale(1) opacity(.45)}
.animal small{font-size:14px;opacity:.7}
.desc{margin:-4px auto 12px;max-width:560px;min-height:2.4em;font-family:'Nunito',system-ui,sans-serif;font-weight:600;font-size:16px;line-height:1.3;text-wrap:balance}
#abChip.cd{opacity:.55}
.go{font-family:var(--display);font-size:38px;background:var(--sun);border:3px solid var(--ink);
  border-radius:20px 14px 22px 12px;padding:4px 34px 2px;box-shadow:4px 5px 0 var(--ink)}
.go:active{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--ink)}
.keys{margin-top:14px;font-size:18px;opacity:.85}
kbd{font-family:var(--body);border:2px solid var(--ink);border-radius:7px;padding:0 6px;background:#fff}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.stars img{height:64px}
.stars img.off{filter:grayscale(1) opacity(.3)}
.endcard{max-width:980px}
.endgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:center}
@media (max-width:760px){.endgrid{grid-template-columns:minmax(0,1fr)}}
.league{border-left:3px dashed rgba(46,31,22,.25);padding-left:22px;text-align:left;min-width:0}
@media (max-width:760px){.league{border-left:0;border-top:3px dashed rgba(46,31,22,.25);padding:14px 0 0}}
.league h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0;color:var(--leaf);text-shadow:2px 2px 0 var(--ink);text-align:center}
.lgnote{margin:4px 0 10px;text-align:center;font-size:20px;min-height:1.3em}
.lgnote b{color:var(--berry)}
.lgrows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lgrow{display:grid;grid-template-columns:28px 46px minmax(0,1fr) auto;align-items:center;gap:8px;padding:3px 8px;border:2.5px solid transparent;border-radius:14px 10px 16px 9px}
.lgrow.me{border-color:var(--ink);background:#fff6cf}
.lgrank{font-size:24px;text-align:center;font-variant-numeric:tabular-nums}
.lgrow img{height:38px;max-width:46px;object-fit:contain;justify-self:center}
.lgbarwrap{min-width:0}
.lgname{font-size:17px;line-height:1;display:flex;justify-content:space-between;gap:6px}
.lgname small{opacity:.65;font-size:14px}
.lgbar{height:14px;border:2px solid var(--ink);border-radius:8px 5px 9px 4px;background:#fffdf5;overflow:hidden;margin-top:3px}
.lgfill{height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);
  background-image:repeating-linear-gradient(-55deg,rgba(255,255,255,.35) 0 3px,transparent 3px 7px)}
.lgstars{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lgplus{color:var(--berry);font-size:18px;margin-left:2px}
@media (prefers-reduced-motion:reduce){.lgfill{transition:none}}
@media (max-height:520px){.league h2{font-size:26px}.lgnote{font-size:16px;margin:0 0 4px}.lgrows{gap:1px}
  .lgrow{grid-template-columns:22px 32px minmax(0,1fr) auto;padding:1px 6px}.lgrow img{height:24px}
  .lgrank{font-size:17px}.lgname{font-size:13px}.lgname small{font-size:11px}.lgbar{height:9px;margin-top:2px}.lgstars{font-size:16px}
  .endgrid{gap:14px}}
.animal .rank{font-size:13px;opacity:.75;min-height:1em}
.res{display:grid;grid-template-columns:auto auto;gap:2px 18px;justify-content:center;font-size:24px;margin:6px 0 16px;text-align:left}
.res b{font-variant-numeric:tabular-nums}
@media (max-height:520px){h1{font-size:48px}.sub{margin:2px 0 6px;font-size:18px}.card{padding:10px 18px 12px;font-size:18px}
  .animal img{height:40px}.pick{margin:4px 0 8px;gap:6px}.go{font-size:30px}.keys{margin-top:6px;font-size:15px}
  .stars img{height:44px}.res{font-size:19px;margin:2px 0 8px}}
@media (max-width:560px){.pick{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:14px 14px 18px}}

/* Dotykové ovládání */
#touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#touch.on{display:flex}
#touch .grp{display:flex;gap:14px;pointer-events:auto}
.tb{width:76px;height:76px;border-radius:50% 46% 52% 44%;border:3px solid var(--ink);background:rgba(251,247,236,.8);
  font-family:var(--display);font-size:34px;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.down{background:var(--sun)}
.tb img{height:44px}
#rotate{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-family:var(--body);font-size:18px;

<script>
(() => {
'use strict';
// ====================== NASTAVENÍ ======================
const VIEW_H = 540, GROUND = 460, MIN_VIEW_W = 720;
const G = 2100, JUMP_V = 770, MAX_FALL = 1150;
const INK = '#2e1f16';

// Postavy. Pro prototyp hraje jen opice; ostatní mají připravené vlastnosti z návrhu.
const ANIMALS = [
  {id:'opice', name:'Opice', img:'opice', ready:true, run:310, jump:1.00, climb:0.55, h:100, faceR:true, hb:[46,82],
   act:'banan', icon:'banan', lianaBreak:0,
   desc:'Hází banány (E): masožravka se nají a usne. Na liáně šplhá nejrychleji.'},
  {id:'slon', name:'Slon', img:'slon', ready:true, run:275, jump:0, climb:1.0, h:156, faceR:true, hb:[112,140],
   act:'voda', icon:'kapka', cd:1.0, lianaBreak:0, immuneWater:true, heavy:true, noJump:true, reach:70,
   desc:'Velký a těžký: neskáče a na liánu nemůže. Chobotem stříká vodu (E): rozvalí klády, shodí smradlavé ovoce, smyje lepidlo a zažene papouška. Ovoce sebere hlavou. Voda od slona mu nevadí.'},
  {id:'tygr', name:'Tygr', img:'tygr', ready:true, run:378, jump:1.07, climb:.75, h:92, faceR:false, hb:[66,72],
   act:'rev', icon:'tygr', cd:4, lianaBreak:.5, breakTxt:'Drápky přetrhly liánu!',
   desc:'Nejrychlejší a skočí nejdál. Řevem (E) zažene papouška, vyleká piraně i masožravku. Drápky můžou přetrhnout liánu.'},
  {id:'krokodyl', name:'Krokodýl', img:'krokodyl', ready:true, run:290, jump:.95, climb:.9, h:88, faceR:true, hb:[130,48], legs:true,
   act:'chnap', icon:'krokodyl', cd:3, lianaBreak:0, climbRot:-1.4, pirFriend:true, low:true,
   desc:'Piraně se ho bojí, most pod ním nepraskne. Papoušek nad ním přeletí, ale voda od slona ho trefí. Chňapnutím (E) vyleká masožravku. Na liánu se zakousne a vytáhne.'},
  {id:'papousek', name:'Papoušek', img:'papousek', ready:true, run:290, jump:.95, climb:.85, h:92, faceR:false, hb:[40,74],
   act:'hlas', icon:'papousek', cd:.6, lianaBreak:0, fly:true, flaps:1, glide:true, parrotFriend:true,
   desc:'Ve vzduchu ještě jednou mávne křídly (druhý skok) a když držíš skok, plachtí. S dobrým načasováním přeletí i masožravku a klády. Na E si jen tak povídá.'},
  {id:'had', name:'Had', img:'had', ready:true, run:300, jump:.9, climb:.8, h:34, faceR:false, hb:[84,32],
   act:'pssst', icon:'had', cd:.6, lianaBreak:0, climbRot:-1.5, stickyFree:true, low:true,
   desc:'Plazí se, takže ho lepidlo ze smradlavého ovoce nezpomalí. Je nízký, voda od slona i papoušek nad ním přeletí. Na liánu se zavěsí a sklouzne. Na E zasyčí, ale nic se nestane.'},
];

const FRUITS = ['mango','pomeranc','jahoda','merunka','citron','ananas'];
// ===== Jungle League – týmy podle zvířat, sčítají se hvězdy =====
// Doplní se po založení Firebase projektu (projectId a webový apiKey). Bez nich hra běží, liga jen ukáže, že je zavřená.
const LEAGUE = { projectId: 'majohra-101df', apiKey: 'AIzaSyB2_ZMauDOgP4PE8Dad2_4HcUqe0j9EvBQ' };  // Firebase web klíč – veřejný identifikátor, ochranu dělají pravidla
const TEAM_COL = {opice:'#b07b45', slon:'#9aa5b4', tygr:'#f08a24', krokodyl:'#4fa83a', papousek:'#e2483c', had:'#e6c43a'};
const League = {
  data: null,
  base(){ return `https://firestore.googleapis.com/v1/projects/${LEAGUE.projectId}/databases/(default)/documents`; },
  enabled(){ return !!(window.__leagueMock || (LEAGUE.projectId && LEAGUE.apiKey)); },
  async load(){
    if(window.__leagueMock) return this.data = window.__leagueMock.load();
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 6000);
    try{
      const r = await fetch(`${this.base()}/league?pageSize=20&key=${LEAGUE.apiKey}`, {signal:ctl.signal});
      if(!r.ok) throw new Error(r.status);
      const j = await r.json(); const out = {};
      for(const d of (j.documents||[])){ const id=d.name.split('/').pop(); const f=d.fields||{};
        out[id] = {stars:+(f.stars?.integerValue||0), runs:+(f.runs?.integerValue||0)}; }
      return this.data = out;
    } finally { clearTimeout(tm); }
  },
  async add(team, stars){
    if(window.__leagueMock) return window.__leagueMock.add(team, stars);
    const doc = `projects/${LEAGUE.projectId}/databases/(default)/documents/league/${team}`;
    const body = {writes:[{transform:{document:doc, fieldTransforms:[
      {fieldPath:'stars', increment:{integerValue:String(stars)}},
      {fieldPath:'runs',  increment:{integerValue:'1'}} ]}}]};
    const r = await fetch(`${this.base()}:commit?key=${LEAGUE.apiKey}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error(r.status);
  }
};
function teamRows(data){
  return ANIMALS.map(a=>({id:a.id, name:a.name, img:a.img, stars:data?.[a.id]?.stars||0, runs:data?.[a.id]?.runs||0}))
    .sort((x,y)=> y.stars-x.stars || y.runs-x.runs || ANIMALS.findIndex(a=>a.id===x.id)-ANIMALS.findIndex(a=>a.id===y.id));
}
const vyprav = n => n===1?'výprava':(n>=2&&n<=4)?'výpravy':'výprav';
function renderLeague(data, me, plus){
  const rows = teamRows(data), max = Math.max(1, ...rows.map(r=>r.stars));
  const ol = $('lgRows'); ol.innerHTML='';
  rows.forEach((r,i)=>{
    const li=document.createElement('li'); li.className='lgrow'+(r.id===me?' me':'');
    li.innerHTML=`<span class="lgrank">${i+1}.</span><img src="assets/${r.img}.png" alt="">
      <div class="lgbarwrap"><div class="lgname"><span>${r.name}</span><small>${r.runs} ${vyprav(r.runs)}</small></div>
      <div class="lgbar"><div class="lgfill" style="background-color:${TEAM_COL[r.id]}"></div></div></div>
      <span class="lgstars">${r.stars} ★${r.id===me&&plus?`<span class="lgplus">+${plus}</span>`:''}</span>`;
    ol.appendChild(li);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ li.querySelector('.lgfill').style.width=(100*r.stars/max)+'%'; }));
  });
  return rows;
}
async function leagueAfterRun(team, stars){
  const note=$('lgNote'); const tname = ANIMALS.find(a=>a.id===team).name;
  if(!League.enabled()){ note.textContent='Jungle League se brzy otevře!'; renderLeague(null, team, 0); return; }
  note.textContent='Načítám ligu…'; $('lgRows').innerHTML='';
  let data;
  try{ data = await League.load(); }catch(e){ note.textContent='Jungle League se teď nenačetla.'; return; }
  const before = teamRows(data).findIndex(r=>r.id===team)+1;
  renderLeague(data, team, 0);
  const after = JSON.parse(JSON.stringify(data||{})); after[team] = {stars:(after[team]?.stars||0)+stars, runs:(after[team]?.runs||0)+1};
  setTimeout(()=>{ const rows = renderLeague(after, team, stars); const now = rows.findIndex(r=>r.id===team)+1;
    note.innerHTML = `Tvoje <b>${stars} ★</b> jdou týmu <b>${tname}</b>!` + (now<before?` Postup na ${now}. místo!`:''); updateMenuRanks(after); }, 700);
  try{ await League.add(team, stars); }catch(e){ note.textContent='Hvězdy se teď nepodařilo odeslat do ligy.'; }
}
function updateMenuRanks(data){
  if(!data) return; const rows = teamRows(data);
  rows.forEach((r,i)=>{ const el=document.querySelector(`#pick-${r.id} .rank`); if(el) el.textContent=`${i+1}. v lize`; });
}

const IMG_NAMES = ['merunka','pomeranc','jahoda','citron','ananas','krokodyl_telo','krokodyl_noha_zadni','krokodyl_noha_predni','opice','slon','tygr','krokodyl','papousek','had','masozravka','masozravka_spi','ovoce_smrad',
  'kaluz','smrad','kapka','pirana','banan','mango','klady','liana','prkno','palma','strom','kvetina','cedule','kamen','hvezda','mrak1','mrak2','mrak3'];

// ====================== POMOCNÉ ======================
const IMG = {};
function loadImages(){
  return Promise.all(IMG_NAMES.map(n => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = () => res(); im.src = `assets/${n}.png`;
  })));
}
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const fmt=s=>s.toFixed(1).replace('.',',')+' s';
function rectsHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

// ====================== ZVUK (jednoduché pípání) ======================
let actx=null, soundOn=true;
function sfx(type){
  if(!soundOn) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const S = {
      jump:['triangle',420,720,.13,.18], hit:['square',260,90,.25,.12], mango:['sine',880,1320,.1,.15],
      splash:['sawtooth',300,60,.45,.1], ham:['square',180,60,.2,.15], squawk:['sawtooth',900,1400,.18,.07],
      banana:['triangle',600,300,.15,.15], climb:['triangle',300,700,.35,.12], win:['triangle',520,1040,.5,.18],
      pop:['sine',500,200,.12,.15]
    }[type]; if(!S) return;
    o.type=S[0]; o.frequency.setValueAtTime(S[1],t); o.frequency.exponentialRampToValueAtTime(S[2],t+S[3]);
    g.gain.setValueAtTime(S[4],t); g.gain.exponentialRampToValueAtTime(.001,t+S[3]);
    o.start(t); o.stop(t+S[3]+.02);
  }catch(e){}
}

// ====================== VSTUP ======================
const keys={left:false,right:false,jump:false,banana:false};
let jumpPressed=false, bananaPressed=false;
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyE:'banana',ShiftLeft:'banana',ShiftRight:'banana',KeyJ:'jump'};
function press(k,down){
  if(down && !keys[k]){ if(k==='jump') jumpPressed=true; if(k==='banana') bananaPressed=true; }
  keys[k]=down;
}
addEventListener('keydown',e=>{ const k=KEYMAP[e.code]; if(k && state==='play'){ press(k,true); e.preventDefault(); }});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k){ press(k,false); }});
document.querySelectorAll('#touch .tb').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{ e.preventDefault(); b.classList.add('down'); press(k,true); };
  const off=e=>{ e.preventDefault(); b.classList.remove('down'); press(k,false); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

// ====================== PLÁTNO ======================
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let DPR=1, S=1, viewW=MIN_VIEW_W, offY=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(innerWidth*DPR); cv.height=Math.round(innerHeight*DPR);
  S=cv.height/VIEW_H; viewW=cv.width/S; offY=0;
  if(viewW<MIN_VIEW_W){ S=cv.width/MIN_VIEW_W; viewW=MIN_VIEW_W; offY=(cv.height-VIEW_H*S)/2; }
}
addEventListener('resize',resize); resize();

// Pastelkové textury generované při startu (zem, tráva, voda, papír)
function crayonTile(w,h,base,strokes,seed){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,w,h);
  const r=mulberry32(seed);
  for(let i=0;i<strokes.n;i++){
    const x=r()*w, y=r()*h, len=6+r()*16, a=strokes.angle+(r()-.5)*.5;
    const col=strokes.cols[(r()*strokes.cols.length)|0];
    g.strokeStyle=col; g.globalAlpha=(.12+r()*.28)*(strokes.a||1); g.lineWidth=.8+r()*2.2; g.lineCap='round';
    for(const dx of [-w,0,w]) for(const dy of [-h,0,h]){
      g.beginPath(); g.moveTo(x+dx,y+dy); g.lineTo(x+dx+Math.cos(a)*len,y+dy+Math.sin(a)*len); g.stroke();
    }
  }
  g.globalAlpha=1; return c;
}
let PAT={};
function makePatterns(){
  PAT.earth=ctx.createPattern(crayonTile(256,256,'#b07b45',{n:2600,angle:-1.0,cols:['#8a5a30','#c9955a','#7a4a22','#e0b27a']},11),'repeat');
  PAT.grass=ctx.createPattern(crayonTile(256,64,'#5aa83a',{n:900,angle:-1.2,cols:['#3f8a2a','#7cc44c','#2f7020','#a6d86a']},12),'repeat');
  PAT.water=ctx.createPattern(crayonTile(256,256,'#5aaee6',{n:1800,angle:-.3,cols:['#3a8ed0','#8ccaf2','#ffffff','#2a70b8']},13),'repeat');
  PAT.paper=ctx.createPattern(crayonTile(256,256,'#fbf7ec',{n:500,angle:-.9,cols:['#efe6cf','#ffffff','#e8dcc0']},14),'repeat');
  PAT.sky=ctx.createPattern(crayonTile(256,256,'#d6ecfb',{n:1500,a:.55,angle:-.75,cols:['#bcdcf6','#e4f3fd','#a8cff0','#cbe5f9']},18),'repeat');
  PAT.hill=ctx.createPattern(crayonTile(256,256,'#cfe3b0',{n:1200,angle:-1.0,cols:['#b6d68e','#e2efcc','#a9cc80']},15),'repeat');
  PAT.hill2=ctx.createPattern(crayonTile(256,256,'#a9cf86',{n:1200,angle:-1.0,cols:['#8fbf68','#c4e0a4','#7fb05a']},16),'repeat');
  PAT.wood=ctx.createPattern(crayonTile(128,128,'#9a6a36',{n:500,angle:-.2,cols:['#7a4a22','#b98a52']},17),'repeat');
}

// ====================== HRA – STAV ======================
let state='menu', animal=ANIMALS[0], L=null, P=null, camX=0, time=0, hits=0, mangos=0, bananas=2, abCd=0, seed=0;
let texts=[], parts=[];

function genLevel(sd){
  const r=mulberry32(sd);
  const TYPES=['slon','most','masozravka','smrad','papousek','klady'];
  let list=[];
  for(const t of TYPES){ const n=2+(r()<.5?1:0); for(let i=0;i<n;i++) list.push(t); }
  // zamíchat tak, aby stejná nástraha nešla dvakrát po sobě
  for(let tries=0;tries<200;tries++){
    for(let i=list.length-1;i>0;i--){ const j=(r()*(i+1))|0; [list[i],list[j]]=[list[j],list[i]]; }
    if(list.every((t,i)=>i===0||t!==list[i-1])) break;
  }
  const lv={ground:[], platforms:[], hazards:[], mangos:[], bananas:[], decor:[], far:[], front:[], start:120, finish:0, seenHint:{}, counts:{}};
  let x=520, gStart=0;
  const freeZone=(x0,x1)=>{ // volný úsek: plošinky a manga
    const w=x1-x0;
    if(w>320 && r()<.6){
      const pw=60*(2+((r()*3)|0)), px=x0+60+r()*(w-pw-120), py=GROUND-(70+r()*30);
      lv.platforms.push({x:px,y:py,w:pw,h:22});
      for(let i=0;i<pw/60;i++) lv.mangos.push({x:px+30+i*60,y:py-46,got:false,k:FRUITS[(r()*6)|0]});
    } else {
      const n=3+((r()*3)|0), cx=x0+w/2, arc=r()<.5;
      for(let i=0;i<n;i++){ const dx=(i-(n-1)/2)*52; lv.mangos.push({x:cx+dx,y:GROUND-46-(arc?Math.cos(dx/90)*70:0),got:false,k:FRUITS[(r()*6)|0]}); }
    }
  };
  for(const t of list){
    const gap=360+r()*240; freeZone(x, x+gap); x+=gap;
    lv.counts[t]=(lv.counts[t]||0)+1;
    const h={type:t, x, first: lv.counts[t]===1};
    if(t==='slon'){ h.w=520; h.ex=x+430; h.t=r()*2; h.drops=[]; h.raise=0; }
    if(t==='most'){ h.w=560; h.bx0=x+60; h.bx1=x+500; h.on=0; h.broken=false; h.planks=[]; h.fish=[];
      for(let px=h.bx0;px<h.bx1-1;px+=55) h.planks.push({x:px,y:GROUND,vy:0,rot:0,vr:0});
      for(let i=0;i<3;i++) h.fish.push({x:h.bx0+60+i*140, y:GROUND+120, vy:0, t:r()*2.5, active:false});
      lv.ground.push([gStart,h.bx0]); gStart=h.bx1; }
    if(t==='masozravka'){ h.w=380; h.px=x+240; h.st='open'; h.t=r()*1.5; h.cycle=0;
      lv.bananas.push({x:x-150,y:GROUND-58,got:false}); }
    if(t==='smrad'){ h.w=440; h.tx=x+220; h.fruits=[{x:x+110,y:GROUND-250,st:'hang',vy:0,t:0},{x:x+340,y:GROUND-268,st:'hang',vy:0,t:0}]; h.puddles=[]; }
    if(t==='papousek'){ h.w=600; h.px=x+520; h.py=GROUND-282; h.st='perch'; h.t=0; h.bx=h.px; h.by=h.py; h.vx=0; h.vy=0; }
    if(t==='klady'){ h.w=560; h.cx=x+90; h.lx=x+150; h.wx0=x+190; h.wx1=x+380; h.wh=250; h.sway=r()*6; }
    lv.hazards.push(h); x+=h.w;
  }
  const tail=420; freeZone(x, x+tail); x+=tail;
  lv.finish=x+120; lv.end=x+560;
  lv.ground.push([gStart, lv.end+200]);
  // dekorace
  for(let dx=-200; dx<lv.end+400; dx+=140+r()*240){
    const kinds=['palma','strom','kvetina','palma','kvetina'];
    lv.decor.push({x:dx,k:kinds[(r()*kinds.length)|0],s:.45+r()*.35});
  }
  for(let dx=-200; dx<lv.end+400; dx+=220+r()*260){ lv.far.push({x:dx,k:r()<.6?'palma':'strom',s:.35+r()*.2}); }
  for(let dx=300; dx<lv.end; dx+=500+r()*700){ lv.front.push({x:dx,s:.38+r()*.15}); }
  lv.clouds=[];
  for(let dx=0; dx<lv.end*.3+2000; dx+=520+r()*520){ lv.clouds.push({x:dx,y:50+r()*150,k:['mrak1','mrak2','mrak3'][(r()*3)|0],s:.45+r()*.45,par:.12+r()*.12,v:6+r()*10}); }
  lv.mangoTotal=lv.mangos.length;
  lv.parBase = 0.6*(lv.counts.klady||0) + 0.4*(lv.counts.masozravka||0) + 0.3*(lv.counts.most||0);
  return lv;
}

function newPlayer(){
  return {x:L.start+80, y:GROUND, vx:0, vy:0, face:1, onGround:true, coyote:0, jbuf:0,
    st:'normal', stT:0, slowT:0, slowKind:'', land:0, anim:0, safeX:L.start+80, sw:null, blink:0};
}

function startGame(){
  seed = (Math.random()*1e9)|0;
  L=genLevel(seed); P=newPlayer(); camX=0; time=0; hits=0; mangos=0; bananas=2; abCd=0; texts=[]; parts=[]; flying=[]; sprays=[];
  L.par = L.finish/animal.run + L.parBase + animal.climb*(L.counts.klady||0);
  $('abIcon').src=$('abTouch').src=`assets/${animal.icon}.png`;
  for(const k in keys) keys[k]=false; jumpPressed=bananaPressed=false;
  state='play';
  document.getElementById('menu').hidden=true; document.getElementById('end').hidden=true;
  document.getElementById('hud').hidden=false;
  document.getElementById('touch').classList.toggle('on',isTouch);
  document.getElementById('rotate').classList.add('ingame');
  updHud(); cv.focus?.();
}
function toMenu(){
  state='menu'; document.getElementById('menu').hidden=false; document.getElementById('end').hidden=true;
  document.getElementById('hud').hidden=true; document.getElementById('touch').classList.remove('on');
  document.getElementById('rotate').classList.remove('ingame');
}
function finish(){
  state='end'; sfx('win');
  // přívětivé hodnocení: 3★ do 1,7× ideálního času, 2★ do 2,6×
  const t3=L.par*1.7, t2=L.par*2.6;
  const st = time<=t3?3 : time<=t2?2 : 1;
  $('nextStar').textContent = st===3 ? 'Super, všechny tři hvězdy!' :
    `Na ${st===2?'třetí':'další'} hvězdu stačí doběhnout do ${Math.ceil(st===2?t3:t2)} s.`;
  document.getElementById('stars').innerHTML=[0,1,2].map(i=>`<img src="assets/hvezda.png" alt="" class="${i<st?'':'off'}">`).join('');
  document.getElementById('stars').setAttribute('aria-label',`${st} ze 3 hvězd`);
  document.getElementById('rTime').textContent=fmt(time);
  document.getElementById('rMango').textContent=`${mangos} ${mangos===1?'kus':mangos>=2&&mangos<=4?'kusy':'kusů'}`;
  document.getElementById('rHits').textContent=hits===0?'ani jednou':`${hits}×`;
  document.getElementById('end').hidden=false; document.getElementById('touch').classList.remove('on');
  leagueAfterRun(animal.id, st);
}

// ====================== EFEKTY ======================
function say(x,y,txt,col='#2e1f16',size=30,life=1.2){ texts.push({x,y,txt,col,size,life,t:0}); }
function burst(x,y,col,n=10,spd=260){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=spd*(.4+Math.random()*.8);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,col,r:3+Math.random()*4,life:.6+Math.random()*.4,t:0}); } }
function slow(dur,kind,label){
  if(P.slowT<=0){ hits++; }
  P.slowT=Math.max(P.slowT,dur); P.slowKind=kind;
  if(label) say(P.x,P.y-120,label,kind==='voda'?'#2a70b8':'#5d7a2a',30);
}
function stun(dur,label){ hits++; P.st='stun'; P.stT=dur; P.vx=0; sfx('hit'); if(label) say(P.x,P.y-120,label,'#d9343f',32); }
function knock(dir,label){ hits++; P.st='knock'; P.stT=.5; P.vx=(animal.heavy?260:380)*dir; P.vy=animal.heavy?-300:-440; P.onGround=false; sfx('ham'); if(label) say(P.x,P.y-120,label,'#d9343f',34); }

// ====================== FYZIKA HRÁČE ======================
function playerRect(p=P){ const [w,h]=animal.hb; return {x:p.x-w/2,y:p.y-h,w,h}; }
function supportAt(x){
  for(const s of L.ground) if(x+14>s[0] && x-14<s[1]) return true;
  for(const h of L.hazards) if(h.type==='most' && !h.broken && x+14>h.bx0 && x-14<h.bx1) return true;
  return false;
}

function updatePlayer(dt){
  const A=animal;
  P.anim+=dt; P.land=Math.max(0,P.land-dt);
  if(P.slowT>0) P.slowT-=dt;
  const slowF = P.slowT>0 ? .62 : 1;
  if(jumpPressed) P.jbuf=.13; else P.jbuf=Math.max(0,P.jbuf-dt);

  // --- zvláštní stavy ---
  if(P.st==='stun'){ P.stT-=dt; P.vx=0; if(P.stT<=0) P.st='normal'; applyGravity(dt); moveY(dt); return; }
  if(P.st==='water'){ P.stT-=dt; P.vy=60; P.y+=P.vy*dt;
    if(P.stT<=0){ respawnBridge(); } return; }
  if(P.st==='swing'){ updateSwing(dt); return; }

  // --- běh ---
  let dir=(keys.right?1:0)-(keys.left?1:0);
  if(P.st==='knock'){ P.stT-=dt; dir=0; if(P.stT<=0 && P.onGround) P.st='normal'; }
  else {
    const target=dir*A.run*slowF, acc=P.onGround?2600:1700;
    if(Math.abs(target-P.vx)<acc*dt) P.vx=target; else P.vx+=Math.sign(target-P.vx)*acc*dt;
    if(dir) P.face=dir;
  }

  // --- skok / liána ---
  if(P.st==='normal' && P.jbuf>0){
    const k=L.hazards.find(h=>h.type==='klady' && P.x>h.cx-64 && P.x<h.wx0);
    if(A.noJump){ P.jbuf=0;
      if(k && !L.seenHint.slonLiana){ L.seenHint.slonLiana=1; say(P.x,P.y-170,'Slon je moc těžký na liánu. Stříkni vodu (E)!','#2a70b8',24,2); } }
    else if(k && P.onGround){ startSwing(k); P.jbuf=0; return; }
    if(A.noJump){}
    else if(P.onGround || P.coyote>0){ P.vy=-JUMP_V*A.jump*(slowF<1?.9:1); P.onGround=false; P.coyote=0; P.jbuf=0; sfx('jump'); }
    else if(A.flaps && P.flaps>0){ P.flaps--; P.vy=-JUMP_V*1.08; P.jbuf=0; sfx('jump'); burst(P.x,P.y-30,'#4fa83a',5,140); }
  }
  if(P.onGround){ P.coyote=.1; P.flaps=A.flaps||0; } else P.coyote=Math.max(0,P.coyote-dt);

  applyGravity(dt);
  // horizontální pohyb + klády
  const oldX=P.x; P.x+=P.vx*dt;
  P.x=Math.max(L.start-60,P.x);
  for(const h of L.hazards){ if(h.type!=='klady' || h.broken) continue;
    const wr={x:h.wx0,y:GROUND-h.wh,w:h.wx1-h.wx0,h:h.wh};
    if(rectsHit(playerRect(),wr)){
      if(oldX<=h.wx0){ P.x=h.wx0-animal.hb[0]/2-1; const hitV=P.vx; P.vx=Math.min(P.vx,0); if(P.st!=='stun' && Math.abs(hitV)>150 && !animal.noJump){ stun(1.0, h.first&&!L.seenHint.bum?'Bum! Klády nepustí, stojíš kolo':'Bum!'); L.seenHint.bum=1; P.vx=0; burst(h.wx0,P.y-50,'#a0682f',8); } }
      else P.x=h.wx1+animal.hb[0]/2+1;
    }
  }
  moveY(dt);
}
function applyGravity(dt){
  let g=G; if(P.vy<0 && !keys.jump && P.st==='normal') g*=2.3;
  P.vy=Math.min(MAX_FALL,P.vy+g*dt);
  if(animal.glide && keys.jump && P.vy>140 && P.st==='normal') P.vy=140;
}
function moveY(dt){
  const prevY=P.y; P.y+=P.vy*dt; const was=P.onGround; P.onGround=false;
  if(P.vy>=0){
    for(const pl of L.platforms){
      if(P.x+16>pl.x && P.x-16<pl.x+pl.w && prevY<=pl.y+1 && P.y>=pl.y){ P.y=pl.y; P.vy=0; P.onGround=true; }
    }
    if(!P.onGround && prevY<=GROUND+1 && P.y>=GROUND && supportAt(P.x)){ P.y=GROUND; P.vy=0; P.onGround=true; }
  }
  if(P.onGround && !was && prevY<P.y-1) P.land=.12;
  if(P.onGround && P.y>=GROUND && P.st==='normal' && supportAt(P.x)) P.safeX=P.x;
  // pád do vody pod mostem
  if(P.y>GROUND+64 && P.st!=='water'){
    const br=L.hazards.find(h=>h.type==='most' && P.x>h.bx0-30 && P.x<h.bx1+30);
    P.st='water'; P.stT=.9; P.vx=0; P.bridge=br; sfx('splash'); hits++;
    burst(P.x,GROUND+70,'#5aaee6',16,320);
    say(P.x,GROUND-40,'Šplouch! Hezky zpátky před most','#2a70b8',30,1.6);
  }
}
function respawnBridge(){
  const br=P.bridge;
  P.st='normal'; P.vy=0; P.vx=0; P.onGround=true; P.y=GROUND;
  P.x = br ? br.bx0-70 : P.safeX;
  if(br){ br.broken=false; br.on=0; br.planks.forEach((p,i)=>{p.x=br.bx0+i*55;p.y=GROUND;p.vy=0;p.rot=0;}); br.fish.forEach(f=>f.active=false); }
}

// ----- liána přes klády -----
function startSwing(k){
  if(k.regrow>0){ say(P.x,P.y-120,'Liána ještě roste…','#3f8a2a',24,.9); return; }
  P.st='swing'; P.sw={k,t:0,x0:P.x}; P.vx=0; P.vy=0; sfx('climb');
  // slon (váha) a tygr (drápky) můžou liánu utrhnout – ale nikdy dvakrát po sobě na stejné zdi
  if(animal.lianaBreak && !k.brokeOnce && Math.random()<animal.lianaBreak) P.sw.breakAt=animal.climb*.6;
  if(k.first && !L.seenHint.liana){ say(P.x,P.y-130,animal.fly?'Frrr, přes klády!':'Hop na liánu!','#3f8a2a',30); L.seenHint.liana=1; }
}
function updateSwing(dt){
  const s=P.sw, k=s.k, A=animal; s.t+=dt;
  const climbT=A.climb, overT=.5, topY=GROUND-300;
  if(s.breakAt && s.t>=s.breakAt){ // liána praskla
    k.brokeOnce=true; k.regrow=1.6; sfx('pop'); burst(k.lx,P.y-90,'#3f8a2a',10,220);
    P.sw=null; P.vy=0; P.vx=0; P.onGround=false;
    stun(1.0+0.4, A.breakTxt); P.x=k.cx; return;
  }
  if(A.fly){ // papoušek liánu nepotřebuje – přeletí
    const T=climbT+overT, u=Math.min(1,s.t/T);
    P.x=lerp(s.x0,k.wx1+70,u); P.y=GROUND-Math.sin(u*Math.PI)*(k.wh+90); P.face=1;
    if(s.t>=T){ P.st='normal'; P.y=GROUND; P.onGround=true; P.vx=A.run*.8; P.land=.12; P.sw=null; }
    return;
  }
  if(s.t<climbT){ // šplh nahoru
    const u=ease(s.t/climbT);
    P.x=lerp(s.x0,k.lx-8,Math.min(1,u*2)); P.y=lerp(GROUND,topY,u); P.face=1;
  } else if(s.t<climbT+overT){ // přeskok přes klády
    const u=(s.t-climbT)/overT;
    P.x=lerp(k.lx-8,k.wx1+70,u); P.y=lerp(topY,GROUND,u)-Math.sin(u*Math.PI)*70;
  } else { P.st='normal'; P.y=GROUND; P.onGround=true; P.vx=A.run*.8; P.land=.12; P.sw=null; }
}

// ====================== NÁSTRAHY ======================
function updateHazards(dt){
  const pr=playerRect();
  for(const h of L.hazards){
    const near=Math.abs(h.x-P.x)<1400;
    if(!near) continue;
    if(h.type==='slon'){
      if(h.calm>0){ h.calm-=dt; h.raise=Math.max(0,h.raise-dt*4); }
      else h.t+=dt;
      const cyc=3.0, ph=h.t%cyc;
      h.raise = ph>1.6 && ph<2.25 ? Math.min(1,(ph-1.6)/.4) : Math.max(0,h.raise-dt*4);
      if(!(h.calm>0) && ph>=2.0 && ph-dt<2.0 && P.x<h.ex+60){ for(let i=0;i<4;i++) h.drops.push({x:h.ex-72-i*16,y:GROUND-48+Math.sin(i)*4,vx:-470,d:0,delay:i*.05}); }
      for(const d of h.drops){
        if(d.delay>0){ d.delay-=dt; continue; }
        d.x+=d.vx*dt; d.d+=Math.abs(d.vx)*dt; d.y=GROUND-52+Math.sin(d.d/40)*4;
        if(!d.dead && rectsHit(pr,{x:d.x-10,y:d.y-12,w:20,h:24}) && P.st!=='swing'){
          d.dead=true; burst(d.x,d.y,'#6cb8ec',8,200);
          if(animal.immuneWater){ if(!L.seenHint.osv){ say(P.x,P.y-130,'Tůt, osvěžující!','#2a70b8',28); L.seenHint.osv=1; } }
          else { slow(2,'voda', h.first&&!L.seenHint.voda?'Čvacht! Mokrý kožich zpomaluje':'Čvacht!'); L.seenHint.voda=1; }
        }
      }
      h.drops=h.drops.filter(d=>!d.dead && d.d<480);
    }
    if(h.type==='most'){
      const onB = !h.broken && P.onGround && P.x>h.bx0 && P.x<h.bx1 && P.y>=GROUND-1;
      if(h.scared>0) h.scared-=dt;
      if(animal.pirFriend && Math.abs((h.bx0+h.bx1)/2-P.x)<500){ h.scared=Math.max(h.scared||0,.5);
        if(!h.krokous){ h.krokous=1; say((h.bx0+h.bx1)/2,GROUND+20,'Ááá, krokouš!','#7a4fb0',30,1.6); } }
      if(onB && !(h.scared>0)) h.on+=dt; else if(!h.broken) h.on=Math.max(0,h.on-dt*.5);
      const BREAK=3.4;
      if(!h.broken && h.on>BREAK){ h.broken=true; sfx('pop'); say((h.bx0+h.bx1)/2,GROUND-110,'Křup! Piraně přehryzly provaz','#7a4fb0',28,1.6);
        h.planks.forEach(p=>{p.vy=-80-Math.random()*120; p.vr=(Math.random()-.5)*6;}); }
      if(h.broken){ h.planks.forEach(p=>{p.vy+=G*.6*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; if(p.y>GROUND+90){p.y=GROUND+90;p.vy=0;p.vr*=.9;}}); }
      // piraně skáčou z vody; když stojíš na mostě, míří k provazům
      for(const f of h.fish){
        f.t-=dt;
        if(h.scared>0 && !f.active){ f.t=Math.max(f.t,.3); continue; }
        if(!f.active && f.t<=0){ f.active=true; f.vy=-(560+Math.random()*160);
          f.x = h.on>.2 ? (Math.random()<.5?h.bx0+22:h.bx1-22) : h.bx0+40+Math.random()*(h.bx1-h.bx0-80); f.y=GROUND+100; }
        if(f.active){ f.vy+=G*.75*dt; f.y+=f.vy*dt; if(f.y>GROUND+110 && f.vy>0){ f.active=false; f.t=h.on>.2?.25+Math.random()*.4:1+Math.random()*2; burst(f.x,GROUND+70,'#8ccaf2',5,150);} }
      }
    }
    if(h.type==='klady' && h.regrow>0) h.regrow-=dt;
    if(h.type==='klady' && h.broken) h.breakT+=dt;
    if(h.type==='masozravka'){
      h.t+=dt;
      const zone={x:h.px-96,y:GROUND-200,w:150,h:200};
      if(h.st==='open'){
        h.cycle+=dt;
        if(h.cycle>2.4){ h.st='snap'; h.t=0; sfx('ham'); }
        else if(rectsHit(pr,zone) && P.st!=='knock'){ h.st='snap'; h.t=0;
          knock(-1, h.first&&!L.seenHint.ham?'Ham! Masožravka tě vyplivla':'Ham! Pfuj!'); L.seenHint.ham=1; }
      } else if(h.st==='snap'){ if(h.t>1.3){ h.st='open'; h.cycle=0; } }
      else if(h.st==='sleep'){ if(h.t>5){ h.st='open'; h.cycle=0; } }
    }
    if(h.type==='smrad'){
      for(const f of h.fruits){
        if(f.st==='hang' && P.x>f.x-330 && P.x<f.x+40){ f.st='shake'; f.t=0; }
        if(f.st==='shake'){ f.t+=dt; if(f.t>.75){ f.st='fall'; } }
        if(f.st==='fall'){ f.vy+=G*.7*dt; f.y+=f.vy*dt;
          if(!f.wet && rectsHit(pr,{x:f.x-19,y:f.y-14,w:38,h:38})){ f.st='gone'; burst(f.x,f.y,'#a9c43a',14,260); sfx('pop');
            slow(2.5,'smrad',h.first&&!L.seenHint.fuj?'Fuj, to smrdí! A lepí to!':'Fuj!'); L.seenHint.fuj=1; }
          else if(f.y>=GROUND-14){ f.st='gone'; burst(f.x,GROUND-10,'#a9c43a',12,220); sfx('pop'); h.puddles.push({x:f.x,t:0}); }
        }
      }
      for(const pd of h.puddles){ pd.t+=dt;
        if(pd.t<5.5 && !animal.stickyFree && P.onGround && P.y>=GROUND-1 && Math.abs(P.x-pd.x)<26+animal.hb[0]*.2){
          if(P.slowT<=0) say(P.x,P.y-120,'Lepí to! Příště hop přes flek','#5d7a2a',26);
          slow(Math.max(P.slowT,.8),'smrad');
        }
      }
    }
    if(h.type==='papousek'){
      if(h.calm>0) h.calm-=dt;
      if(h.st==='perch' && P.x>h.px-440 && P.x<h.px){
        if(animal.parrotFriend){ if(!h.greeted){ h.greeted=1; say(h.bx,h.by-60,'Ahoj, kámo!','#3aa0e0',26); } }
        else if(h.calm>0){ if(!h.calmSaid){ h.calmSaid=1; say(h.bx,h.by-60,'Klid…','#3aa0e0',24); } }
        else { h.st='alert'; h.t=0; sfx('squawk'); } }
      if(h.st==='alert'){ h.t+=dt; if(h.t>1.0){ h.st='dive'; h.t=0;
        const tx=P.x, ty=P.y-70, dx=tx-h.bx, dy=ty-h.by, d=Math.hypot(dx,dy); h.vx=dx/d*520; h.vy=dy/d*520; h.ty=ty; } }
      if(h.st==='dive'){ h.t+=dt; h.bx+=h.vx*dt; h.by+=h.vy*dt;
        if(h.by>=h.ty){ h.by=h.ty; h.vy=0; h.vx=-420; h.st='glide'; h.t=0; } }
      if(h.st==='glide'){ h.t+=dt; h.bx+=h.vx*dt; if(h.t>.4){ h.st='leave'; } }
      if(h.st==='leave'){ h.bx+=-260*dt; h.by+=-420*dt; if(h.by<-120) h.st='gone'; }
      if((h.st==='dive'||h.st==='glide') && rectsHit(pr,{x:h.bx-28,y:h.by-24,w:56,h:44})){
        burst(P.x,P.y-60,'#e2483c',6,200); burst(P.x,P.y-60,'#3aa0e0',6,200); sfx('squawk');
        slow(2.5,'klovnuti',h.first&&!L.seenHint.klov?'Klofanec! Zpomalení na dvě kola':'Au, klofanec!'); L.seenHint.klov=1;
        h.st='leave';
      }
    }
  }
}

// schopnosti
let flying=[], sprays=[];
function useAbility(){
  const a=animal.act;
  if(a==='banan') return throwBanana();
  if(abCd>0) return;
  abCd=animal.cd;
  if(a==='voda'){ sfx('splash');
    for(let i=0;i<5;i++) sprays.push({x:P.x+P.face*40,y:P.y-64+i*3,vx:600*P.face,vy:-60+i*30,d:0,delay:i*.04}); }
  if(a==='chnap'){ sfx('ham'); say(P.x+P.face*40,P.y-80,'Chňap!','#3f8a2a',34,.9);
    for(const h of L.hazards){
      if(h.type==='masozravka' && h.st!=='sleep' && Math.abs(h.px-P.x)<260){ h.st='snap'; h.t=-1.7; say(h.px,GROUND-230,'Lek!','#3f8a2a',28); }
      if(h.type==='papousek' && (h.st==='dive'||h.st==='glide'||h.st==='alert') && Math.abs(h.bx-P.x)<300){ h.st='leave'; say(h.bx,h.by-30,'Frr, a je pryč!','#3aa0e0',24); }
    } }
  if(a==='hlas'){ sfx('squawk'); const t=['Ahoj!','Nazdarrrr!','Co to furrrt mačkáš!'][(P.talk=(P.talk||0)+1)%3];
    say(P.x,P.y-120,t,'#3aa0e0',30,1.1); }
  if(a==='pssst'){ sfx('climb'); say(P.x,P.y-80,'Psssst!','#7a4fb0',30,1); }
  if(a==='rev'){ sfx('ham'); say(P.x,P.y-130,'Uáááá!','#e07a1a',42,1);
    parts.push({ring:true,x:P.x,y:P.y-50,t:0,life:.5});
    for(const h of L.hazards){ const dx=Math.abs(((h.px??h.ex??h.bx0??h.cx??h.x))-P.x);
      if(h.type==='papousek' && dx<620 && (h.st==='perch'||h.st==='alert'||h.st==='dive'||h.st==='glide')){ h.st='leave'; say(h.bx,h.by-40,'Frr, a je pryč!','#3aa0e0',26); }
      if(h.type==='most' && Math.abs((h.bx0+h.bx1)/2-P.x)<700){ h.scared=4; h.fish.forEach(f=>f.active=false); say((h.bx0+h.bx1)/2,GROUND-120,'Piraně: Utíkáme!','#7a4fb0',26); }
      if(h.type==='masozravka' && dx<420 && h.st!=='sleep'){ h.st='snap'; h.t=-1.7; say(h.px,GROUND-230,'Lek!','#3f8a2a',28); }
    } }
  updHud();
}
function updateSprays(dt){
  for(const d of sprays){
    if(d.delay>0){ d.delay-=dt; continue; }
    d.vy+=500*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.d+=Math.abs(d.vx)*dt;
    const r={x:d.x-12,y:d.y-12,w:24,h:24};
    for(const h of L.hazards){
      if(h.type==='klady' && !h.broken && rectsHit(r,{x:h.wx0,y:GROUND-h.wh,w:h.wx1-h.wx0,h:h.wh})){
        h.broken=true; h.breakT=0; d.dead=true; sfx('hit'); burst(h.wx0+20,GROUND-120,'#a0682f',14,300);
        say((h.wx0+h.wx1)/2,GROUND-h.wh-30,'Šplích! Klády se rozkutálely!','#2a70b8',28,1.6); }
      if(h.type==='smrad'){ for(const f of h.fruits) if((f.st==='hang'||f.st==='shake') && Math.abs(f.x-d.x)<40){ f.st='fall'; f.vy=0; f.wet=true; }
        for(const pd of h.puddles) if(pd.t<5.5 && Math.abs(pd.x-d.x)<60 && d.y>GROUND-40){ pd.t=5.5; d.dead=true; say(pd.x,GROUND-50,'Čisto!','#2a70b8',24,.9); } }
      if(h.type==='papousek' && (h.st==='alert'||h.st==='dive'||h.st==='glide'||h.st==='perch') && rectsHit(r,{x:h.bx-30,y:h.by-30,w:60,h:60})){ h.st='leave'; d.dead=true; say(h.bx,h.by-30,'Fuj, mokro! Frr!','#3aa0e0',24); }
    }
    if(d.y>GROUND) { d.dead=true; burst(d.x,GROUND-4,'#8ccaf2',3,120); }
  }
  sprays=sprays.filter(d=>!d.dead && d.d<520);
}
// banány

  if(bananas<=0){ say(P.x,P.y-120,'Banány došly!','#7a5a2a',24,.9); return; }
  say(P.x+P.face*30,P.y-110,'Tumáš!','#7a5a2a',30,.9); bananas--; flying.push({x:P.x+P.face*20,y:P.y-70,vx:560*P.face+P.vx*.3,vy:-360,rot:0}); sfx('banana'); updHud();
}
function updateFlying(dt){
  for(const b of flying){
    b.vy+=1400*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=12*dt;
    for(const h of L.hazards){ if(h.type!=='masozravka'||h.st==='sleep') continue;
      if(rectsHit({x:b.x-14,y:b.y-14,w:28,h:28},{x:h.px-80,y:GROUND-200,w:150,h:150})){

function updatePickups(){
  const pr=playerRect(); if(animal.reach){ pr.y-=animal.reach; pr.h+=animal.reach; }

  if(animal.act==='banan') for(const b of L.bananas){ if(!b.got && rectsHit(pr,{x:b.x-20,y:b.y-20,w:40,h:40})){ b.got=true; bananas++; sfx('mango'); say(b.x,b.y-30,'+1 banán','#7a5a2a',24,.9); updHud(); } }

function update(dt){
  if(state!=='play') return;
  time+=dt;
  if(abCd>0) abCd-=dt;
  if(bananaPressed && P.st==='normal') useAbility();
  updateSprays(dt);
  updatePlayer(dt); updateHazards(dt); updateFlying(dt); updatePickups();
  jumpPressed=false; bananaPressed=false;
  for(const t of texts){ t.t+=dt; t.y-=30*dt; } texts=texts.filter(t=>t.t<t.life);
  for(const p of parts){ p.t+=dt; if(p.ring) continue; p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; } parts=parts.filter(p=>p.t<p.life);
  const target=clamp(P.x-viewW*.36,L.start-140,L.end-viewW);
  camX+= (target-camX)*Math.min(1,dt*6);
  if(P.x>=L.finish) finish();
  hudTick();
}

function img(name,x,y,w,h,o={}){
  const im=IMG[name]; if(!im) return;
  ctx.save(); ctx.translate(x,y);
  if(o.rot) ctx.rotate(o.rot);
  ctx.scale((o.flip?-1:1)*(o.sx||1),(o.sy||1));
  if(o.alpha!=null) ctx.globalAlpha=o.alpha;
  const ax=o.ax??.5, ay=o.ay??1;
  ctx.drawImage(im,-w*ax,-h*ay,w,h); ctx.restore();
}
const H = (name,w)=>IMG[name]?w*IMG[name].height/IMG[name].width:w;

function wobblyLine(x0,x1,y,amp,seedOff){
  ctx.beginPath();
  for(let x=x0;x<=x1+1;x+=12){ const yy=y+Math.sin((x+seedOff)*.031)*amp+Math.sin((x+seedOff)*.087)*amp*.5; x===x0?ctx.moveTo(x,yy):ctx.lineTo(x,yy); }
}

function drawBackground(){
  // bleděmodré pastelkové nebe (nahoře syté, k obzoru světlejší)
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=PAT.paper; ctx.fillRect(0,0,cv.width,cv.height); ctx.restore();
  ctx.save(); ctx.translate(-camX*.05,0); ctx.fillStyle=PAT.sky; ctx.fillRect(camX*.05-20,-400,viewW+40,VIEW_H+460); ctx.restore();
  const gr=ctx.createLinearGradient(0,0,0,380); gr.addColorStop(0,'rgba(120,184,236,.35)'); gr.addColorStop(.55,'rgba(150,200,240,.08)'); gr.addColorStop(1,'rgba(251,247,236,.35)');
  ctx.fillStyle=gr; ctx.fillRect(-20,-400,viewW+40,800);
  // mraky (pomalu plují a mají vlastní paralaxu)
  for(const c of L.clouds){
    const w={mrak1:300,mrak2:240,mrak3:360}[c.k]*c.s, span=L.end*c.par+viewW+800;
    let x=((c.x+time*c.v - camX*c.par) % span + span) % span - 400;
    if(x<-w||x>viewW+w) continue;
    img(c.k,x,c.y,w,H(c.k,w),{ay:.5,alpha:.97});
  }
  // vzdálené kopce (paralaxa)
  for(const [par,pat,base,amp] of [[.25,PAT.hill,290,40],[.5,PAT.hill2,350,30]]){
    ctx.save(); ctx.translate(-camX*par,0);
    const x0=camX*par-50, x1=camX*par+viewW+50;
    ctx.beginPath(); ctx.moveTo(x0,VIEW_H+40);
    for(let x=x0;x<=x1;x+=16) ctx.lineTo(x,base+Math.sin(x*.004+par*9)*amp+Math.sin(x*.011)*amp*.4);
    ctx.lineTo(x1,VIEW_H+40); ctx.closePath(); ctx.fillStyle=pat; ctx.fill();
    ctx.strokeStyle='rgba(46,31,22,.35)'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  }
  ctx.save(); ctx.translate(-camX*.5,0);
  for(const d of L.far){ const sx=d.x; if(sx<camX*.5-300||sx>camX*.5+viewW+300) continue;
    const w=(d.k==='palma'?230:220)*d.s*1.4; img(d.k,sx,GROUND-60,w,H(d.k,w),{alpha:.45}); }
  ctx.restore();
}

function drawGround(){
  for(const s of L.ground){
    const x0=Math.max(s[0],camX-40), x1=Math.min(s[1],camX+viewW+40); if(x1<=x0) continue;
    ctx.fillStyle=PAT.earth; ctx.fillRect(x0,GROUND+6,x1-x0,VIEW_H-GROUND+60);
    // tráva
    ctx.fillStyle=PAT.grass; wobblyLine(x0,x1,GROUND,2.5,0); ctx.lineTo(x1,GROUND+22); ctx.lineTo(x0,GROUND+22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.lineCap='round'; wobblyLine(x0,x1,GROUND,2.5,0); ctx.stroke();
    // trsy trávy
    ctx.strokeStyle='#2f7020'; ctx.lineWidth=2;
    for(let x=Math.ceil(x0/37)*37;x<x1;x+=37){ const k=(x*7919)%5; if(k>2) continue; ctx.beginPath(); ctx.moveTo(x,GROUND+2); ctx.lineTo(x-4,GROUND-9); ctx.moveTo(x+3,GROUND+2); ctx.lineTo(x+6,GROUND-11); ctx.stroke(); }
  }
  // okraje propastí
  ctx.strokeStyle=INK; ctx.lineWidth=3;
  for(const h of L.hazards) if(h.type==='most'){
    for(const ex of [h.bx0,h.bx1]){ ctx.beginPath(); ctx.moveTo(ex,GROUND); ctx.lineTo(ex+(ex===h.bx0?-6:6),VIEW_H+20); ctx.stroke(); }
  }
}

function drawWater(){
  for(const h of L.hazards){ if(h.type!=='most') continue;
    if(h.bx1<camX-50||h.bx0>camX+viewW+50) continue;
    const wy=GROUND+64;

    // vodopád pozadí
    ctx.fillStyle='#e6f2f8'; ctx.fillRect(h.bx0,GROUND,h.bx1-h.bx0,VIEW_H);
    ctx.fillStyle=PAT.water; ctx.beginPath(); wobblyLine(h.bx0,h.bx1,wy,4,time*60);
    ctx.lineTo(h.bx1,VIEW_H+40); ctx.lineTo(h.bx0,VIEW_H+40); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=2.5; wobblyLine(h.bx0,h.bx1,wy,4,time*60); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2;
    for(let x=h.bx0+20;x<h.bx1;x+=70){ ctx.beginPath(); ctx.moveTo(x+Math.sin(time*2+x)*6,wy+26); ctx.quadraticCurveTo(x+14,wy+20,x+28,wy+26); ctx.stroke(); }
    // piraně
    for(const f of h.fish){ if(!f.active) continue; const w=78; img('pirana',f.x,f.y,w,H('pirana',w),{ay:.5,rot:f.vy<0?1.2:-1.2,flip:f.x>(h.bx0+h.bx1)/2}); }
    ctx.restore();

function drawBridges(){
  for(const h of L.hazards){ if(h.type!=='most') continue;
    if(h.bx1<camX-80||h.bx0>camX+viewW+80) continue;
    const k=clamp(h.on/2.2,0,1);
    // sloupky
    ctx.fillStyle=PAT.wood; ctx.strokeStyle=INK; ctx.lineWidth=3;
    for(const px of [h.bx0-14,h.bx1+6]){ ctx.beginPath(); ctx.rect(px,GROUND-70,10,76); ctx.fill(); ctx.stroke(); }
    if(!h.broken){
      const shake = k>.55 ? Math.sin(time*50)*k*3 : 0;
      // zábradlí
      const ropeCol = k<.5?'#8a5a30':k<.8?'#c0702a':'#d9343f';
      ctx.strokeStyle=ropeCol; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(h.bx0-9,GROUND-66); ctx.quadraticCurveTo((h.bx0+h.bx1)/2,GROUND-26+k*20,h.bx1+11,GROUND-66); ctx.stroke();
      ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.stroke();
      ctx.strokeStyle=ropeCol; ctx.lineWidth=2.5;
      for(const p of h.planks){ const t=(p.x+27-h.bx0)/(h.bx1-h.bx0); const ry=GROUND-66+ (40+k*20)*4*t*(1-t)*.98;
        ctx.beginPath(); ctx.moveTo(p.x+27,ry); ctx.lineTo(p.x+27,GROUND); ctx.stroke(); }
      for(const p of h.planks){ img('prkno',p.x+27,GROUND+20+shake*((p.x/55)%2?1:-1),58,24); }
      // kousance na provazu
      if(k>.2){ ctx.fillStyle='#d9343f'; ctx.font=`18px ${FONT_B}`; ctx.textAlign='center'; ctx.fillText('kous!',h.bx0+10,GROUND-80-Math.sin(time*12)*3); ctx.fillText('kous!',h.bx1-10,GROUND-80-Math.cos(time*12)*3); }
    } else {
      for(const p of h.planks) img('prkno',p.x+27,p.y+20,58,24,{rot:p.rot});
      ctx.strokeStyle='#8a5a30'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(h.bx0-9,GROUND-66); ctx.quadraticCurveTo(h.bx0+10,GROUND,h.bx0+20,GROUND+40); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(h.bx1+11,GROUND-66); ctx.quadraticCurveTo(h.bx1-10,GROUND,h.bx1-20,GROUND+40); ctx.stroke();
    }
  }
}

function drawHazardsFront(){
  for(const h of L.hazards){
    if(h.x>camX+viewW+400 || h.x+h.w<camX-400) continue;
    if(h.type==='slon'){

      if(h.st==='sleep'){ name='masozravka_spi'; sy=1+Math.sin(time*2)*.025; }

      if(h.st==='sleep'){ ctx.fillStyle='#5a7ab0'; ctx.font=`${22+Math.sin(time*3)*4}px ${FONT_D}`; ctx.textAlign='left'; ctx.fillText('Zzz',h.px+30,GROUND-190-((h.t*20)%30)); }
    }
    if(h.type==='smrad'){
      for(const pd of h.puddles){ const a=pd.t<5.5?1:Math.max(0,1-(pd.t-5.5)); if(a<=0) continue;
        img('kaluz',pd.x,GROUND+10,76,H('kaluz',76),{alpha:a});
        img('smrad',pd.x+Math.sin(time*2+pd.x)*6,GROUND-22-((time*30+pd.x)%34),44,H('smrad',44),{alpha:a*.7}); }
      for(const f of h.fruits){ if(f.st==='gone') continue;
        if(f.st==='hang'||f.st==='shake'){ ctx.strokeStyle='#4a3a1a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(f.x,GROUND-330); ctx.lineTo(f.x,f.y-26); ctx.stroke(); }
        const r= f.st==='shake'?Math.sin(time*40)*.25:0;
        if(f.st==='shake'){ ctx.fillStyle='#d9343f'; ctx.font=`34px ${FONT_D}`; ctx.textAlign='center'; ctx.fillText('!',f.x,f.y-36); }
        img('ovoce_smrad',f.x,f.y+30,58,H('ovoce_smrad',58),{rot:r});
      }
    }
    if(h.type==='klady'){
      if(!h.broken) img('klady',(h.wx0+h.wx1)/2,GROUND+8,h.wx1-h.wx0+10,h.wh+14);
      else if(h.breakT<2.4 && IMG.klady){ // čtyři klády se skutálí a odkutálejí
        const im=IMG.klady, W=h.wx1-h.wx0+10, Hh=h.wh+14, sc=im.height/Hh;
        const logs=[[190,240],[140,190],[90,140],[40,90]];
        logs.forEach(([a,b],i)=>{
          const t=h.breakT, fall=Math.min(1,t*(1.6+i*.3)), lh=b-a;
          const y0=GROUND+8-Hh+a*(Hh/250), yTarget=GROUND-lh*(Hh/250);
          const y=lerp(y0,yTarget,fall*fall), x=(h.wx0+h.wx1)/2+t*t*(60+i*40)+i*14;
          ctx.save(); ctx.globalAlpha=Math.max(0,1-Math.max(0,t-1.6)/.8); ctx.translate(x,y+lh*(Hh/250)/2); ctx.rotate(t*(1.5+i*.4));
          ctx.drawImage(im,0,a*sc,im.width,lh*sc,-W/2,-lh*(Hh/250)/2,W,lh*(Hh/250)); ctx.restore();
        }); }
      // liána
      const top=GROUND-445; let bx=h.lx+Math.sin(time*1.4+h.sway)*8, by=GROUND-120;
      if(h.regrow>0) by=lerp(GROUND-120,top+40,clamp(h.regrow/1.2,0,1));
      if(P.st==='swing' && P.sw && P.sw.k===h){ const s=P.sw; if(s.t<animal.climb){ bx=P.x+10; by=Math.max(P.y-80,top+60);} }
      drawLiana(h.lx, top, bx, by);
    }
    if(h.type==='papousek'){
      if(h.st==='gone') continue;
      let rot=0, w=58, yoff=0;
      if(h.st==='perch'){ yoff=Math.sin(time*3)*2; }
      if(h.st==='alert'){ rot=Math.sin(time*40)*.12;
        ctx.fillStyle='#d9343f'; ctx.font=`40px ${FONT_D}`; ctx.textAlign='center'; ctx.fillText('!',h.bx,h.by-110); }
      if(h.st==='dive'){ rot=-Math.atan2(h.vy,-h.vx)*.8; }
      if(h.st==='glide'){ rot=0; }
      if(h.st==='leave'){ rot=.5; }
      img('papousek',h.bx,h.by+yoff+(h.st==='perch'||h.st==='alert'?0:40),w,H('papousek',w),{rot});
    }
  }
}
function drawLiana(x0,y0,x1,y1){
  const len=Math.max(40,Math.hypot(x1-x0,y1-y0));
  ctx.save(); ctx.translate(x0,y0); ctx.rotate(Math.atan2(x0-x1,y1-y0));
  if(IMG.liana){ const w=34; ctx.drawImage(IMG.liana,-w/2,0,w,len); }
  ctx.restore();
}

function drawPlatforms(){
  for(const pl of L.platforms){ if(pl.x>camX+viewW+100||pl.x+pl.w<camX-100) continue;
    for(let x=pl.x;x<pl.x+pl.w-1;x+=60) img('prkno',x+30,pl.y+24,62,28);
    // provázky ke stromu (aby plošinka nevisela ve vzduchu)
    ctx.strokeStyle='#3f8a2a'; ctx.lineWidth=3;
    for(const x of [pl.x+8,pl.x+pl.w-8]){ ctx.beginPath(); ctx.moveTo(x,pl.y); ctx.quadraticCurveTo(x+6,pl.y-120,x,-10); ctx.stroke(); }
  }
}
function drawPickups(){
  for(const m of L.mangos){ if(m.got||m.x<camX-50||m.x>camX+viewW+50) continue; { const im=IMG[m.k]||IMG.mango, hh=m.k==='ananas'?50:40, ww=hh*im.width/im.height; img(m.k||'mango',m.x,m.y+Math.sin(time*3+m.x)*4,ww,hh,{ay:.5}); } }
  if(animal.act==='banan') for(const b of L.bananas){ if(b.got||b.x<camX-50||b.x>camX+viewW+50) continue; img('banan',b.x,b.y+Math.sin(time*3+b.x)*4,40,H('banan',40),{ay:.5,rot:Math.sin(time*2)*.2}); }
  for(const b of flying) img('banan',b.x,b.y,38,H('banan',38),{ay:.5,rot:b.rot});
  for(const d of sprays){ if(d.delay>0) continue; img('kapka',d.x,d.y,20,28,{ay:.5,rot:Math.atan2(d.vy,d.vx)-Math.PI/2}); }
}

function drawPlayer(){
  const A=animal, h=A.h, im=IMG[A.img], w=h*im.width/im.height;
  let sx=1, sy=1, rot=0, bob=0;
  const running=P.onGround && Math.abs(P.vx)>20 && P.st==='normal';
  if(running){ const f=P.slowT>0?8:14; bob=-Math.abs(Math.sin(P.anim*f))*7; rot=Math.sin(P.anim*f)*.09; }
  else if(P.onGround){ sy=1+Math.sin(P.anim*3)*.02; }
  if(!P.onGround && P.st!=='swing'){ if(P.vy<0){sy=1.08;sx=.93;} else {sy=.97;sx=1.03;} }
  if(P.land>0){ const u=P.land/.12; sy=1-.15*u; sx=1+.12*u; }
  if(P.st==='stun'){ rot=Math.sin(P.anim*20)*.12; }
  if(P.st==='knock'){ rot=-P.face*.4; }
  if(P.st==='swing'){ rot=Math.sin(P.anim*22)*.12; sy=1.04;
    if(A.climbRot && P.sw && P.sw.t<A.climb){ rot=A.climbRot*(A.faceR?1:-1)+Math.sin(P.anim*18)*.08; }
    if(A.fly){ rot=0; sy=1+Math.sin(P.anim*30)*.08; } }
  if(A.fly && !P.onGround && P.st==='normal'){ sy=1+Math.sin(P.anim*30)*.07; }
  if(A.id==='had' && running){ sy=1+Math.sin(P.anim*16)*.12; bob=0; rot=Math.sin(P.anim*16)*.04; }
  if(P.st==='water'){ ctx.save(); ctx.beginPath(); ctx.rect(P.x-80,0,160,GROUND+68); ctx.clip(); }
  if(A.legs && IMG.krokodyl_telo){ // krokodýl: tělo + dvě nohy, které kmitají
    const B=IMG.krokodyl_telo, k=h/192, W=420*k, fl=A.faceR?P.face<0:P.face>0;
    const climbing=P.st==='swing' && P.sw && P.sw.t<A.climb;
    const amp = climbing?.75 : running?.45 : 0, fr = climbing?22 : 12;
    ctx.save(); if(P.st!=='swing'){ ctx.beginPath(); ctx.rect(P.x-400,-2000,800,GROUND+10+2000); ctx.clip(); } // ocas zajde do trávy jen pod úrovní země (při šplhu vůbec)
    ctx.translate(P.x,P.y+bob+4); ctx.rotate(rot); ctx.scale((fl?-1:1)*sx,sy);
    const ox=-W/2, oy=-138*k;   // chodidla (y≈141 v obrázku) stojí na zemi
    ctx.drawImage(B,ox,oy,W,h);
    [['krokodyl_noha_zadni',{x:186,y:98,w:76,h:52,px:224,py:104},0],['krokodyl_noha_predni',{x:314,y:90,w:58,h:42,px:343,py:96},Math.PI]].forEach(([n,g,ph])=>{
      const im=IMG[n]; if(!im) return;
      ctx.save(); ctx.translate(ox+g.px*k, oy+g.py*k); ctx.rotate(Math.sin(P.anim*fr+ph)*amp);
      ctx.drawImage(im,(g.x-g.px)*k,(g.y-g.py)*k,g.w*k,g.h*k); ctx.restore(); });
    ctx.restore(); ctx.restore();
  } else
  img(A.img,P.x,P.y+bob+4,w*sx,h*sy,{flip:A.faceR?P.face<0:P.face>0,rot});
  if(P.st==='water') ctx.restore();
  // efekty stavů
  if(P.st==='stun'){ for(let i=0;i<3;i++){ const a=P.anim*5+i*2.1; img('hvezda',P.x+Math.cos(a)*34,P.y-h-6+Math.sin(a)*8,20,20,{ay:.5}); } }
  if(P.slowT>0){
    if(P.slowKind==='voda'){ for(let i=0;i<3;i++){ const yy=((P.anim*90+i*30)%50); img('kapka',P.x-20+i*20,P.y-h+20+yy,12,16,{ay:.5,alpha:1-yy/50}); } }
    else if(P.slowKind==='smrad'){ img('smrad',P.x+Math.sin(P.anim*3)*8,P.y-h-4-((P.anim*20)%14),60,H('smrad',60),{alpha:.75}); }
    else { // klovnutí – peříčka
      ctx.fillStyle=['#e2483c','#3aa0e0','#4fa83a'][(P.anim*6|0)%3]; ctx.beginPath(); ctx.ellipse(P.x+Math.sin(P.anim*4)*20,P.y-h-10,6,3,P.anim*3,0,7); ctx.fill(); }
  }
}

function drawFront(){
  for(const f of L.front){ if(f.x<camX-100||f.x>camX+viewW+100) continue; const w=80*f.s*1.6; img('kvetina',f.x,VIEW_H+6,w,H('kvetina',w)); }
  for(const p of parts){ ctx.globalAlpha=1-p.t/p.life;
    if(p.ring){ ctx.strokeStyle=p.col||'#e07a1a'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(p.x,p.y,40+p.t*900,0,7); ctx.stroke(); continue; }
    ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of texts){ const a=1-Math.max(0,(t.t-t.life*.6)/(t.life*.4));
    ctx.globalAlpha=a; ctx.font=`${t.size}px ${FONT_D}`; ctx.lineWidth=6; ctx.strokeStyle='#fbf7ec'; ctx.strokeText(t.txt,t.x,t.y); ctx.fillStyle=t.col; ctx.fillText(t.txt,t.x,t.y); }
  ctx.globalAlpha=1;
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  if(!L){ ctx.fillStyle=PAT.paper||'#fbf7ec'; ctx.fillRect(0,0,cv.width,cv.height); return; }
  ctx.setTransform(S,0,0,S,0,offY);
  drawBackground();
  ctx.setTransform(S,0,0,S,-camX*S,offY);
  drawDecorBack();
  drawHazardsBack();
  drawSign(L.start,'START'); drawSign(L.finish,'CÍL');
  drawWater();
  drawGround();
  drawBridges();
  drawPlatforms();
  drawHazardsFront();
  drawPickups();
  drawPlayer();
  drawFront();
}

// ====================== HUD ======================
const $=id=>document.getElementById(id);
function updHud(){ $('tMango').textContent=`${mangos}`;
  if(animal.act==='banan'){ $('tBanana').textContent=bananas; $('abChip').classList.toggle('cd',bananas<=0); }
  else { $('tBanana').textContent= abCd>0 ? abCd.toFixed(1).replace('.',',')+' s' : ({voda:'Stříkat',rev:'Řev',chnap:'Chňap',hlas:'Kecat',pssst:'Syčet'}[animal.act]); $('abChip').classList.toggle('cd',abCd>0); } }
let lastHud=0;
function hudTick(){
  if(time-lastHud<.1 && time>lastHud) return; lastHud=time;
  $('tTime').textContent=fmt(time); if(animal.act!=='banan') updHud();
  const sc=$('slowChip');
  if(P.slowT>0){ sc.hidden=false; sc.className='chip'+(P.slowKind==='voda'?' voda':'');
    $('tSlow').textContent={voda:'(mokro)',smrad:'(smrad)',klovnuti:'(klovnutí)'}[P.slowKind]||''; }
  else sc.hidden=true;
}

// ====================== MENU ======================
const pick=$('pick');
ANIMALS.forEach(a=>{
  const b=document.createElement('button'); b.type='button'; b.className='animal'; b.id='pick-'+a.id;
  b.innerHTML=`<img src="assets/${a.img}.png" alt=""><span>${a.name}</span><small class="rank"></small>`;
  b.disabled=!a.ready; b.setAttribute('aria-pressed',a===animal?'true':'false');
  b.addEventListener('click',()=>{ animal=a; pick.querySelectorAll('.animal').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); $('animalDesc').textContent=a.desc; });
  pick.appendChild(b);
});
$('animalDesc').textContent=animal.desc;
if(League.enabled()) League.load().then(updateMenuRanks).catch(()=>{});
$('bGo').addEventListener('click',()=>{ sfx('pop'); startGame(); });
$('bAgain').addEventListener('click',()=>{ startGame(); });
$('bRestart').addEventListener('click',e=>{ e.currentTarget.blur(); startGame(); });
$('bMenu').addEventListener('click',()=>toMenu());
$('bSound').addEventListener('click',e=>{ soundOn=!soundOn; e.currentTarget.textContent='Zvuk: '+(soundOn?'ano':'ne'); e.currentTarget.setAttribute('aria-pressed',soundOn); e.currentTarget.blur(); });
addEventListener('keydown',e=>{ if(state!=='play' && (e.code==='Enter') ){ if(!$('menu').hidden||!$('end').hidden){ e.preventDefault(); startGame(); } } });

// ====================== START ======================
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; acc+=dt;
  const STEP=1/120; while(acc>=STEP){ update(STEP); acc-=STEP; }
  render(); requestAnimationFrame(frame);
}
Promise.all([loadImages(), document.fonts ? document.fonts.load('40px Majopis').catch(()=>{}) : 0]).then(()=>{
  makePatterns();
  // náhled mapy za menu
  L=genLevel(7); P=newPlayer(); camX=0;
  document.fonts?.ready?.then(()=>{});
  requestAnimationFrame(frame);
});
// pro testování
window.__maj={get state(){return state}, get P(){return P}, get L(){return L}, get time(){return time}, start:startGame, keys, press};
})();
</script>
